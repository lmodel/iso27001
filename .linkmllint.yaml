# linkml-lint reads this file from the directory `just lint` runs in.
# The recommended rules apply unchanged, and `just lint` fails on a warning
# as on an error. Nothing is relaxed: the classes and enums carry the Isms
# prefix in UpperCamelCase, the slots, types and enum values are snake_case,
# and every element has a description. The Annex A values carry a title,
# A.5.1 and so on, because their names cannot hold the dots.
extends: recommended
