[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
# Named like lmodel/slsa's slsa-linkml, so the PyPI name says what it holds;
# the import package stays iso27001. PyPI publishing is off.
name = "iso27001-linkml"
description = "ISO/IEC 27001:2022 information security management system records (LinkML)"
authors = [
  {name = "Noel McLoughlin", email = "noel.mcloughlin@gmail.com"},
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

dependencies = [
  "linkml-runtime >=1.9.5",
]

[dependency-groups]
dev = [
    "linkml>=1.9.6",
    # scripts/apply_sssom_overlay.py merges the SSSOM files into the schema
    # with it; the datamodel does not need it.
    "ruamel-yaml>=0.19.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iso27001"]

# See https://hatch.pypa.io/latest/config/build/#file-selection for how to
# explicitly include files other than default into the build distributions.

[tool.hatch.version]
source = "uv-dynamic-versioning"

# Ref.: https://github.com/ninoseki/uv-dynamic-versioning/
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
fallback-version = "0.0.0"

# Ref.: https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
[tool.pytest.ini_options]
testpaths = ["tests"]

# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
exclude = [
    "src/iso27001/_version.py",
]
# Set oldest supported Python version
target-version = "py310"

# Ref.: https://github.com/codespell-project/codespell
[tool.codespell]
skip = [
  "LICENSE",
  "pyproject.toml",
  "uv.lock",
  "project/*",
  "src/iso27001/datamodel/iso27001_pydantic.py",
  "src/iso27001/datamodel/iso27001.py",
  # ISO Open Data's records, Probo's mitigations and the neighbours' adapt
  # copies, copied as published, and files copied in by the KTL sidecar sync
  # or written by npm, not by hand.
  "src/iso27001/schema/iso-open-data/*",
  "tests/data/third_party/probo/*",
  "tests/neighbours/*",
  ".lokf/scripts/*",
  "website/package-lock.json",
]

# Reminder: words have to be lowercased for the ignore-words-list
# "OT" is operational technology.
ignore-words-list = "linke,ot"
quiet-level = 3

# Ref.: https://github.com/crate-ci/typos (spell checker)
[tool.typos.default.extend-words]
linke = "linke"
# Operational technology.
OT = "OT"

[tool.typos.files]
extend-exclude = [
  "LICENSE",
  "uv.lock",
  "pyproject.toml",
  "project/*",
  "src/iso27001/datamodel/iso27001_pydantic.py",
  "src/iso27001/datamodel/iso27001.py",
  "src/iso27001/schema/iso-open-data/*",
  "tests/data/third_party/probo/*",
  "tests/neighbours/*",
  ".lokf/scripts/*",
  "website/package-lock.json",
]
