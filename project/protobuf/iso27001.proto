  ISMS_RISK_TREATMENT_OPTION_UNSPECIFIED = 0;
  ISMS_RISK_TREATMENT_OPTION_MODIFY = 1;
  ISMS_RISK_TREATMENT_OPTION_RETAIN = 2;
  ISMS_RISK_TREATMENT_OPTION_AVOID = 3;
  ISMS_RISK_TREATMENT_OPTION_SHARE = 4;
}
// The three properties of information that information security preserves, as ISO/IEC 27000 names them.
enum IsmsSecurityProperty {
  ISMS_SECURITY_PROPERTY_UNSPECIFIED = 0;
  ISMS_SECURITY_PROPERTY_CONFIDENTIALITY = 1;
  ISMS_SECURITY_PROPERTY_INTEGRITY = 2;
  ISMS_SECURITY_PROPERTY_AVAILABILITY = 3;
}
