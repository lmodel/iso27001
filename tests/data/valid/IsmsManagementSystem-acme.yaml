# A whole ISMS with one record of each kind it lists, which refer to one
# another by isms_id.
isms_id: acme:isms
title: Acme Widgets ISMS
isms_scope: >-
  The design, sale and delivery of machine parts through the online shop,
  and the systems and people that support them, at the Dublin office.
isms_scope_boundaries:
  - The Dublin office and the cloud services it uses.
isms_scope_exclusions:
  - The German subsidiary, until it joins in 2027.
isms_interfaces:
  - The payment provider handles card data.
isms_processes: The ISMS processes follow the plan, do, check and act cycle.
isms_internal_issues:
  - A small security team.
isms_external_issues:
  - Customers ask for evidence of security.
isms_risk_and_opportunity_actions:
  - Use certification to win larger customers.
isms_planned_changes:
  - Add the German subsidiary in 2027.
isms_external_services:
  - Cloud mail provider
isms_top_management: Managing Director
isms_governing_body: Board of directors
isms_leadership_evidence:
  - The board approves the policy and the security budget each year.
isms_certification_status: certified
isms_certification_body: Example Certification Ltd
isms_certification_date: "2025-06-30"
isms_recertification_date: "2028-06-30"
isms_organization:
  isms_id: acme:organization
  title: Acme Widgets Ltd
  organization_climate_change_relevant: false
isms_interested_parties:
  - isms_id: acme:party-customers
    title: Business customers
isms_policy:
  isms_id: acme:policy-information-security
  title: Information security policy
isms_topic_specific_policies:
  - isms_id: acme:policy-access-control
    title: Access control policy
    topic_policy_parent: acme:policy-information-security
isms_roles:
  - isms_id: acme:role-ciso
    title: Chief Information Security Officer
    role_reports_to: acme:role-managing-director
  - isms_id: acme:role-managing-director
    title: Managing Director
isms_objectives:
  - isms_id: acme:objective-phishing-reports
    title: Report suspected phishing
    responsible_role: acme:role-ciso
isms_risk_assessment_process:
