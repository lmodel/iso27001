# The information security policy, under document control.
isms_id: acme:policy-information-security
title: Information security policy
description: >-
  Acme's commitment to protect the information it holds and the frame for
  its information security objectives.
policy_statement: >-
  Acme protects the confidentiality, integrity and availability of the
  information it holds and keeps improving how it does so.
policy_objectives_framework: Objectives are set each year by the security committee.
