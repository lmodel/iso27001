isms_id: probo:keep-an-history-of-all-your-changes
title: Keep an history of all your changes
control_annex_a_controls:
  - a_8_9
  - a_8_32
control_theme: technological
control_text: Infrastructure as Code (IaC) makes sure all your infrastructure changes are
  done in a standardized and repeatable process - the chance of human error is lower. Moreover,
  IaC enables version control and peer reviews
control_guidance: '**Option 1:** If you don’t want an IaC, provide a screenshot of the logs
  of your infrastructure changes. **Option 2:** If you already have an IaC, we only need a
  screenshot of it'
implementation_state: not_started
