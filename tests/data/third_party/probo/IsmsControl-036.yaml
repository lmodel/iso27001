isms_id: probo:enable-2fa-on-critical-services
title: Enable 2FA on critical services
control_annex_a_controls:
  - a_8_5
  - a_5_17
control_theme: technological
control_text: In order to minimize the threat of someone getting access to something they
  should not, we follow the **secure principle:** nobody can easily get access to data/systems.
  We need to ensure that if someone has access to your password, they still cannot log into
  your account
control_guidance: 'Enable 2FA across all your systems. If you don’t want to activate it everywhere,
  prioritize: - System containing sensitive data - System related to your network, infrastructure
  or production'
implementation_state: not_started
