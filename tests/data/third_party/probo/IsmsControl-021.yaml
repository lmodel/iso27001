isms_id: probo:know-your-recruits
title: Know your recruits
control_annex_a_controls:
  - a_6_1
control_theme: people
control_text: 'When recruiting someone, you want to be sure of who you are hiring: by performing
  reference checks (it can also be background checks), you add an additional layer of certainty
  on the candidate by looking for potential red flags in the candidate’s past (history of
  unethical behavior, harassment, fraud, etc..)'
control_guidance: Recruitment is key, especially early stage, so you are probably already
  doing it right, it is only about documenting it
implementation_state: not_started
