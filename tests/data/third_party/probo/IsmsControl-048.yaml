isms_id: probo:encrypt-your-data-storage
title: Encrypt your data storage
control_annex_a_controls:
  - a_8_11
control_theme: technological
control_text: By encrypting data, you ensure that loss or theft of a device won’t result in
  a data breach. It also protects sensitive information from unauthorized access
control_guidance: You need to ensure that all sensitive data stored is encrypted
