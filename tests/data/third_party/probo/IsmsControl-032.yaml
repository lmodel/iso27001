isms_id: probo:setup-role-based-access
title: Setup role based access
control_annex_a_controls:
  - a_8_2
  - a_8_4
control_theme: technological
control_text: In order to minimize the threat of someone getting access to something they
  should not, we follow the **least privilege principle:** access is limited to what's necessary
  for job duties. We need to define which function should have access to which tool in your
  company to serve as a reference when providing access to people (password manager vaults
  etc.)
implementation_state: not_started
