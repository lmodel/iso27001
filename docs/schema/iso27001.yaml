  IsmsImplementationStatus:
    name: IsmsImplementationStatus
    definition_uri: https://w3id.org/lmodel/iso27001/IsmsImplementationStatus
    description: How far a control or a plan has been put into effect.
    comments:
    - An Annex A control the organization leaves out has no implementation status;
      the Statement of Applicability records it as an IsmsExcludedControl.
    in_subset:
    - isms_annex_a
    from_schema: https://w3id.org/lmodel/iso27001
    permissible_values:
      not_started:
        text: not_started
        description: Nothing has been done yet.
      planned:
        text: planned
        description: The work is planned, with a timeline.
      in_progress:
        text: in_progress
        description: The work is under way.
      implemented:
        text: implemented
        description: The work is done and in operation.
  IsmsRiskTreatmentOption:
    name: IsmsRiskTreatmentOption
    definition_uri: https://w3id.org/lmodel/iso27001/IsmsRiskTreatmentOption
    description: The ways of treating a risk, by the names ISO/IEC 27005 gives them.
    in_subset:
    - isms_risk_management
    from_schema: https://w3id.org/lmodel/iso27001
    permissible_values:
      modify:
        text: modify
        description: Change the risk with controls that lower its likelihood or its
          consequences.
        aliases:
        - mitigate
        - reduce
      retain:
        text: retain
        description: Keep the risk as it is, with the risk owner's approval.
        aliases:
        - accept
      avoid:
        text: avoid
        description: Remove the risk by stopping or changing what gives rise to it.
        aliases:
        - terminate
      share:
        text: share
        description: Share the risk with another party, such as an insurer or a supplier.
        aliases:
        - transfer
  IsmsRiskLevel:
    name: IsmsRiskLevel
    definition_uri: https://w3id.org/lmodel/iso27001/IsmsRiskLevel
    description: A five-point scale of risk level, for an organization that adopts
      it. ISO/IEC 27001 leaves the scale to the organization.
    in_subset:
    - isms_risk_management
    from_schema: https://w3id.org/lmodel/iso27001
    permissible_values:
      very_low:
        text: very_low
        description: Small enough to need no action.
      low:
        text: low
        description: Managed by routine procedures.
      medium:
        text: medium
        description: Needs management's attention and planned controls.
      high:
        text: high
        description: Needs treatment first and escalation.
      critical:
        text: critical
        description: Threatens the organization's objectives and needs action at once.
  IsmsLikelihood:
    name: IsmsLikelihood
    definition_uri: https://w3id.org/lmodel/iso27001/IsmsLikelihood
    description: A five-point scale of likelihood, for an organization that adopts
      it. ISO/IEC 27001 leaves the scale to the organization.
    in_subset:
    - isms_risk_management
    from_schema: https://w3id.org/lmodel/iso27001
    permissible_values:
      rare:
        text: rare
        description: Not expected to happen.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '1'
      unlikely:
        text: unlikely
        description: Could happen, but is not expected to.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '2'
      possible:
        text: possible
        description: Might happen at some point.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '3'
      likely:
        text: likely
        description: Will probably happen.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '4'
      almost_certain:
        text: almost_certain
        description: Expected to happen.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '5'
  IsmsImpact:
    name: IsmsImpact
    definition_uri: https://w3id.org/lmodel/iso27001/IsmsImpact
    description: A five-point scale of consequence, for an organization that adopts
      it. ISO/IEC 27001 leaves the scale to the organization.
    in_subset:
    - isms_risk_management
    from_schema: https://w3id.org/lmodel/iso27001
    permissible_values:
      negligible:
        text: negligible
        description: No noticeable effect on operations or objectives.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '1'
      minor:
        text: minor
        description: An effect normal operations absorb.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '2'
      moderate:
        text: moderate
        description: An effect that needs management to step in.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '3'
      major:
        text: major
        description: A serious effect on objectives, reputation or compliance.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '4'
      severe:
        text: severe
        description: An effect that threatens the organization's survival.
        annotations:
          numeric_value:
            tag: numeric_value
            value: '5'
  IsmsSecurityProperty:
    name: IsmsSecurityProperty
    definition_uri: https://w3id.org/lmodel/iso27001/IsmsSecurityProperty
    annotations:
      iso27001_clause:
        tag: iso27001_clause
        value: 6.1.2
    description: The three properties of information that information security preserves,
      as ISO/IEC 27000 names them.
    in_subset:
    - isms_risk_management
    from_schema: https://w3id.org/lmodel/iso27001
    permissible_values:
      confidentiality:
        text: confidentiality
        description: Only those allowed to see the information can see it.
      integrity:
        text: integrity
        description: The information is accurate and complete.
      availability:
        text: availability
        description: Those allowed to use the information can use it when they need
          it.
  IsmsDocumentKind:
    name: IsmsDocumentKind
    definition_uri: https://w3id.org/lmodel/iso27001/IsmsDocumentKind
    description: The kinds of documented information an IsmsDocumentedInformation
      record holds. Policies have records of their own.
    in_subset:
    - isms_documented_information
    from_schema: https://w3id.org/lmodel/iso27001
    permissible_values:
      procedure:
        text: procedure
        description: The steps for carrying out an activity the same way each time.
      standard:
        text: standard
        description: Mandatory requirements for a technology or a process.
      guideline:
        text: guideline
        description: Recommended practice that supports a policy or a procedure.
      record:
        text: record
        description: Evidence of what was done or achieved.
      plan:
        text: plan
        description: How the organization means to reach an objective.
      report:
        text: report
        description: The formal output of an assessment, audit or review.
  IsmsAuditType:
    name: IsmsAuditType
    definition_uri: https://w3id.org/lmodel/iso27001/IsmsAuditType
    description: Who carries out an audit, relative to the organization audited, as
      ISO 19011 sorts audits.
    in_subset:
    - isms_performance_evaluation
    from_schema: https://w3id.org/lmodel/iso27001
    permissible_values:
      first_party:
        text: first_party
        description: The organization audits itself; an internal audit.
        aliases:
        - internal
      second_party:
        text: second_party
        description: A party with an interest in the organization audits it, such
          as a customer.
      third_party:
        text: third_party
        description: An independent body audits it, such as a certification body or
          a regulator.
  IsmsAuditFindingType:
    name: IsmsAuditFindingType
    definition_uri: https://w3id.org/lmodel/iso27001/IsmsAuditFindingType
    description: The kinds of audit finding.
    in_subset:
    - isms_performance_evaluation
    from_schema: https://w3id.org/lmodel/iso27001
    permissible_values:
      major_nonconformity:
        text: major_nonconformity
        description: A requirement not met in a way that puts the ISMS's intended
          results in doubt.
      minor_nonconformity:
        text: minor_nonconformity
        description: A requirement not met in an isolated way that leaves the ISMS's
          intended results in reach.
      observation:
        text: observation
        description: A condition that could lead to a nonconformity if left alone.
        aliases:
        - opportunity_for_improvement
      positive_finding:
        text: positive_finding
        description: Evidence of practice that works well.
  IsmsIncidentCategory:
    name: IsmsIncidentCategory
    definition_uri: https://w3id.org/lmodel/iso27001/IsmsIncidentCategory
    description: Kinds of information security incident, for sorting incidents. ISO/IEC
      27001 sets no list of its own.
    in_subset:
    - isms_annex_a
    from_schema: https://w3id.org/lmodel/iso27001
    permissible_values:
      malware:
        text: malware
        description: Malicious software, such as a virus, a worm or a trojan.
      ransomware:
        text: ransomware
        description: Malware that encrypts or takes data to extort money.
      phishing:
        text: phishing
        description: A message that tries to trick someone into giving up credentials
          or acting.
      social_engineering:
        text: social_engineering
        description: Manipulating people into disclosing information or acting unsafely.
      unauthorized_access:
        text: unauthorized_access
        description: Access to systems or data by someone not allowed it.
      account_compromise:
        text: account_compromise
        description: Someone else taking control of a legitimate account.
      privilege_misuse:
        text: privilege_misuse
        description: An authorized user going beyond or misusing their privileges.
      data_breach:
        text: data_breach
        description: Confidential or personal information disclosed.
      data_loss:
        text: data_loss
        description: Information lost or corrupted, by accident or otherwise.
      denial_of_service:
        text: denial_of_service
        description: Systems made unavailable by flooding or attack.
      web_application_attack:
        text: web_application_attack
        description: An attack on a web application, such as an injection.
      supply_chain:
        text: supply_chain
        description: An incident that starts at a supplier, a partner or a third-party
          component.
      insider_threat:
        text: insider_threat
        description: Harm done by someone inside the organization, on purpose or by
          neglect.
      physical_security:
        text: physical_security
        description: Theft, loss or damage of physical assets, or physical access
          without permission.
      configuration_error:
        text: configuration_error
        description: A misconfiguration that exposes something.
      cryptographic_failure:
        text: cryptographic_failure
        description: Cryptography that is weak, broken or misused.
      policy_violation:
        text: policy_violation
        description: A breach of the organization's security policies or procedures.
      other:
        text: other
        description: Any incident the other categories do not fit.
  IsmsManagementSystemStandard:
    name: IsmsManagementSystemStandard
    definition_uri: https://w3id.org/lmodel/iso27001/IsmsManagementSystemStandard
    description: Management system standards an ISMS may be integrated with or audited
      beside, each written to ISO's harmonized structure.
    in_subset:
    - isms_core
    from_schema: https://w3id.org/lmodel/iso27001
    permissible_values:
      iso_iec_27001:
        text: iso_iec_27001
        description: Information security management systems.
      iso_iec_27701:
        text: iso_iec_27701
        description: Privacy information management systems.
      iso_iec_42001:
        text: iso_iec_42001
        description: Artificial intelligence management systems.
      iso_9001:
        text: iso_9001
        description: Quality management systems.
      iso_14001:
        text: iso_14001
        description: Environmental management systems.
      iso_22301:
        text: iso_22301
        description: Business continuity management systems.
      iso_iec_20000_1:
        text: iso_iec_20000_1
        description: Service management systems.
slots:
  isms_id:
    name: isms_id
    definition_uri: https://w3id.org/lmodel/iso27001/isms_id
    description: The record's identifier, unique among the ISMS's records, such as
      a URI or a CURIE. Other records refer to the record by it.
    from_schema: https://w3id.org/lmodel/iso27001
    slot_uri: iso27001:isms_id
