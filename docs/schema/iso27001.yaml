classes:
  IsmsRecordMixin:
    name: IsmsRecordMixin
    definition_uri: https://w3id.org/lmodel/iso27001/IsmsRecordMixin
    description: 'What every record of the ISMS has, so that other records can refer
      to it: an identifier, a title and a description.'
    comments:
    - 'It is a mixin, not a base class, so that the adapt copy can re-root some record
      classes on LOKF''s Concept and leave the others as they are: lokf adapt replaces
      isms_id with LOKF''s id, and a class that declares id itself must descend from
      Concept.'
