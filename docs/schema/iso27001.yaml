name: iso27001
annotations:
  standard:
    tag: standard
    value: ISO/IEC 27001:2022
  edition:
    tag: edition
    value: '3'
  publication_date:
    tag: publication_date
    value: '2022-10-25'
  amendment:
    tag: amendment
    value: ISO/IEC 27001:2022/Amd 1:2024
  amendment_publication_date:
    tag: amendment_publication_date
    value: '2024-02-23'
  terms_reference:
    tag: terms_reference
    value: ISO/IEC 27000:2026
  iso_open_data_date:
    tag: iso_open_data_date
    value: '2026-10-28'
description: 'A LinkML model of the records an organization keeps to run an information
  security management system (ISMS) to ISO/IEC 27001:2022 with Amendment 1:2024: its
  context and scope, policies, roles and objectives, risks and their treatment, its
  controls and Statement of Applicability, the support and operation it needs, its
  audits and management reviews, and its nonconformities, corrective actions and improvements.
  The 93 reference controls of Annex A appear by their numbers alone.'
title: ISO/IEC 27001:2022 information security management system records
comments:
- The version is the edition the schema models, 2022, with its one amendment, Amd
  1:2024, and source is ISO's page for that edition. ISO Open Data's records of both,
  and of ISO/IEC 27002:2022 and ISO/IEC 27000:2026, are copied to src/iso27001/schema/iso-open-data/
  as of the date in the annotations, and scripts/check_upstream_release.py reports
  when ISO publishes another supplement or edition. The release tags are the schema's
  own versions.
- ISO/IEC 27001 is copyright ISO and IEC, and none of its text is reproduced here.
  Each element cites the clause or Annex A control it models by number, in the iso27001_clause
  or annex_a_control annotation, and its description is this project's own words.
  A licence holder can merge the standard's wording into a private copy with the overlay
  that src/iso27001/schema/OVERLAY.md describes.
- The terms follow ISO/IEC 27000, which ISO/IEC 27001 refers to for them. On the pinned
  date its current edition is ISO/IEC 27000:2026, which ISO's record titles an overview,
  where every earlier edition was an overview and vocabulary. Whether that edition
  still defines the terms has not been checked against its text.
- Every record that other records refer to has an isms_id, and a reference holds that
  identifier. IsmsManagementSystem holds each kind of record in a list of its own.
- The mappings name terms of the released lmodel/oscal, lmodel/spdx and lmodel/nist-sp-800-53
  schemas, and come from the SSSOM files in src/iso27001/mappings/.
source: https://www.iso.org/standard/82875.html
see_also:
- https://lmodel.github.io/iso27001
- https://www.iso.org/standard/82875.html
- https://www.iso.org/standard/88435.html
